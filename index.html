<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #131210; --surface: #1c1a16; --text: #f3ede4; --muted: #9c9284;
    --border: #35302a; --accent: #f2960f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .badge { width: 40px; height: 4px; background: var(--accent); border-radius: 4px; margin: 0 0 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 20px; letter-spacing: -0.01em; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .level-link {
    display: block; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text); text-decoration: none; font-weight: 600;
    transition: border-color 0.15s, color 0.15s;
  }
  .level-link:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="badge"></div>
  <h1>Student Portal</h1>
  <ul>
<li><a class="level-link" href="https://s1.qloof.cc/">S1</a></li>
<li><a class="level-link" href="https://s2.qloof.cc/">S2</a></li>
<li><a class="level-link" href="https://s3am.qloof.cc/">S3AM</a></li>
<li><a class="level-link" href="https://s3em.qloof.cc/">S3EM</a></li>
  </ul>
</div>
</body>
</html>
